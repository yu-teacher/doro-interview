name: CI

# main 푸시와 PR 마다 린트·타입·테스트를 돌린다. 배포는 하지 않는다(배포 파이프라인은 M2 에서 붙인다).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      # 첫 화면 JS gzip 150KB, 지연 조각 120KB 예산(마크다운 렌더러가 첫 화면에 들어가면 실패한다)
      - run: npm run check:size
      # 모바일 레이아웃·접근성(색 대비 포함): 실제 Chromium 으로 폰 4가지 크기 × 라이트·다크 에서 가로 넘침·글자 잘림·터치 영역·입력 글꼴·axe 를 잰다
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile

  backend:
    name: Backend (converter tests, content integrity, tests on an isolated Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # 변환기 단위 테스트 → 격리 Postgres 기동 → gradle test(마이그레이션·로더·콘텐츠 정합성·모듈 의존 규칙) → 정리
      - run: scripts/ci-test.sh backend

  e2e:
    name: Integration e2e (isolated Postgres, backend jar, built web, real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # 격리 Postgres → bootJar 기동(개발용 노출 스위치 켬) → 웹 빌드·미리보기 → Playwright → 정리
      - run: scripts/e2e-test.sh

  rehearse:
    name: Deploy rehearsal (real images, deploy scripts, gateway with CSP, rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # 서버에서 쓸 Dockerfile·compose·setup/deploy/게이트웨이 스크립트를 격리 환경에서 그대로 실행한다(서버·운영 DB 를 건드리지 않는다)
      - run: REHEARSE_MODE=full scripts/rehearse-deploy.sh
