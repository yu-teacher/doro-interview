server:
  port: 8088

spring:
  application:
    name: doro-interview
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25433}/${DB_NAME:service_interview}
    username: ${DB_USER:doro_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: interview_schema_history
    locations: classpath:db/migration

doro:
  iam:
    # 게이트웨이(BFF)가 붙여 준 Authorization: Bearer 를 이 서비스가 JWKS 로 검증한다. 잘못된·만료된 토큰은 익명으로 취급된다(SDK 규칙).
    jwks-uri: http://${IAM_HOST:localhost}:${IAM_PORT:28080}/.well-known/jwks.json
    # 이 서비스의 BFF 클라이언트가 받은 토큰(cid)만 받아 준다. 다른 클라이언트의 토큰은 거부한다.
    oauth-client-ids: ${INTERVIEW_OAUTH_CLIENT_ID:doro-interview}
    # 다른 곳에서 로그아웃하면 이 서비스의 세션도 바로 끝난다(IAM 에 닿지 못하면 통과 = fail-open, doro-games 와 같은 값)
    revocation-check: ${DORO_IAM_REVOCATION_CHECK:ENFORCE}
    # 탈퇴 사용자 목록 조회용 서버 간 호출(게이트웨이를 거치지 않는 Docker 내부 주소)과 호출자 토큰
    internal-url: http://${IAM_HOST:localhost}:${IAM_PORT:28080}
    internal-token: ${DORO_IAM_INTERNAL_TOKEN:}
  guard:
    # M2 에는 Guard 로 판정할 것이 없다(권한은 "본인 것만" 이고 사용자 id 는 토큰에서만 얻는다). 편집자 권한이 생기는 M4 에서 켠다(docs/M2-PLAN.md D3).
    enabled: false
  web:
    # SDK 의 예외 핸들러는 Guard 예외만 다룬다. 우리 GlobalExceptionHandler 가 오류 규격을 한 곳에서 맡는다.
    exception-handler: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 의존 서비스 상세는 인증 없이 노출하지 않는다. 상태(UP/DOWN)만 공개된다.
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.doro.interview: ${LOG_LEVEL_APP:INFO}

# 질문 콘텐츠(content/ 디렉터리, jar 의 classpath:content/)를 시작할 때 DB 에 반영한다(docs/M0-PLAN.md S4).
interview:
  content:
    location: classpath:content/
    # true: 콘텐츠 파일이 깨져 있으면 기동을 막는다(반쯤 반영된 콘텐츠로 뜨지 않게). 급할 때만 false.
    fail-fast: ${INTERVIEW_CONTENT_FAIL_FAST:true}
  # AI 피드백(선택 기능, docs/M6-PLAN.md): 기본 꺼짐. 켜려면 INTERVIEW_AI_ENABLED=true 와 ANTHROPIC_API_KEY 가 모두 필요하다(키는 환경변수로만).
  ai:
    enabled: ${INTERVIEW_AI_ENABLED:false}
    # gemini(기본) 또는 anthropic. 키는 공급자별 환경변수(GEMINI_API_KEY / ANTHROPIC_API_KEY), 둘 다 비어 있으면 꺼진다.
    provider: ${INTERVIEW_AI_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:${ANTHROPIC_API_KEY:}}
    base-url: ${INTERVIEW_AI_BASE_URL:}
    model: ${INTERVIEW_AI_MODEL:}
    per-user-per-day: ${INTERVIEW_AI_PER_USER_PER_DAY:10}
    global-per-day: ${INTERVIEW_AI_GLOBAL_PER_DAY:100}
    timeout: ${INTERVIEW_AI_TIMEOUT:PT20S}
    max-output-tokens: ${INTERVIEW_AI_MAX_OUTPUT_TOKENS:500}
  # Doro 에서 영구 탈퇴한 사용자의 학습 기록(체크·노트)을 주기적으로 지운다. IAM 내부 API 를 조회하므로 서비스 토큰이 필요하다
  # (DORO_IAM_INTERNAL_TOKEN, IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'interview:<토큰>' 으로 등록). 토큰이 없으면 호출이 거절되어 경고가 남는다.
  deleted-sync:
    enabled: ${INTERVIEW_DELETED_SYNC_ENABLED:true}
    interval: ${INTERVIEW_DELETED_SYNC_INTERVAL:PT1H}
    # 기동 뒤 첫 조회까지의 대기(SDK 기본 2분). 통합 e2e 만 줄여 쓴다.
    initial-delay: ${INTERVIEW_DELETED_SYNC_INITIAL_DELAY:PT2M}
