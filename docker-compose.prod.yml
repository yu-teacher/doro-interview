# 운영(mini) 참고용 compose. **서버에 있는 실제 파일이 기준이고 배포가 덮어쓰지 않는다**(doro-games·party 와 같은 규칙).
# 서버의 ~/doro-interview/.env 에 DB_USER, DB_PASSWORD 가 있어야 한다(서비스 전용 DB 역할: Doro/scripts/split-db-accounts.sh).
# 로그인은 서비스 밖의 BFF(doro-bff)가 맡고 서비스는 게이트웨이가 붙인 Bearer 를 JWKS 로 검증한다. 탈퇴 동기화를 쓰려면 .env 에
# DORO_IAM_INTERNAL_TOKEN 도 있어야 한다(값은 Doro/scripts/enable-deleted-sync.sh 가 발급하는 한 곳뿐이다). Guard 는 M4 에서 붙인다.
services:
  interview-api:
    build:
      context: .
      dockerfile: Dockerfile
      # Doro SDK 소스(settings.gradle 의 includeBuild). 서버에서는 Doro 체크아웃 경로를 DORO_DIR 로 준다.
      additional_contexts:
        doro: ${DORO_DIR:-../Doro}
    image: doro-interview-api:latest
    container_name: doro-interview-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: service_interview
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Doro IAM(JWKS·세션 확인). 게이트웨이(BFF)가 붙인 Bearer 를 검증한다.
      IAM_HOST: auth-api
      IAM_PORT: 8080
      INTERVIEW_OAUTH_CLIENT_ID: ${INTERVIEW_OAUTH_CLIENT_ID:-doro-interview}
      # IAM 내부 API(탈퇴 사용자 목록) 호출자 토큰. IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'interview:<토큰>' 으로 등록한 값이다. 비어 있으면 호출이 거절된다(경고).
      DORO_IAM_INTERNAL_TOKEN: ${DORO_IAM_INTERNAL_TOKEN:-}
      # 검수 전 콘텐츠 노출 스위치는 운영에서 켜지 않는다(prod 프로파일에서 켜면 기동이 거부된다)
    networks:
      - doro-network

  interview-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: doro-interview-web:latest
    container_name: doro-interview-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:80"
    depends_on:
      - interview-api
    networks:
      - doro-network

networks:
  doro-network:
    external: true
    name: doro_doro-network
