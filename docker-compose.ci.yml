# CI 전용 일회용 스택: 테스트가 필요로 하는 Postgres 만 격리해서 띄운다(M0 은 Guard·Redis 를 쓰지 않는다. M2 에서 추가).
# 개발·운영 DB 에 접속하지 않는다. scripts/ci-test.sh 가 올리고 내린다.
name: interview-ci

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_interview
      POSTGRES_USER: doro_admin
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:-ci-only-password}
    ports:
      - "127.0.0.1:${CI_DB_PORT:-25433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doro_admin -d service_interview"]
      interval: 3s
      timeout: 3s
      retries: 20
