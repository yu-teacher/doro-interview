# 배포 리허설용 가짜 게이트웨이 기준 설정: 실제 게이트웨이와 같은 삽입 기준점(menu_upstream, "# 8. DORO Menu Frontend")만 갖는다.
events {}
http {
    upstream menu_upstream {
        server doro-menu:80;
    }

    # BFF 공용 정의(실제 게이트웨이와 같은 모양). 배포 리허설에는 BFF 가 없으므로 닿지 않는 주소를 둔다 — 쿠키 없는 요청은 BFF 를 부르지 않는다.
    # 통합 e2e(scripts/e2e-test.sh)는 이 자리를 가짜 Doro 로 바꾼다.
    upstream bff_upstream {
        server 127.0.0.1:1;
    }

    map $bff_token $bff_authorization {
        ""      $http_authorization;
        default "Bearer $bff_token";
    }

    server {
        listen 80;

        location @bff_forbidden {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 403 '{"success":false,"code":"AUTH-403-03","message":"요청을 확인할 수 없습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.","status":403}';
        }
        location @bff_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "5" always;
            return 503 '{"success":false,"code":"AUTH-503-02","message":"로그인 서버를 잠시 사용할 수 없습니다. 잠시 후 다시 시도해 주세요.","status":503}';
        }

        # 실제 게이트웨이에서는 다른 서비스(블로그·파티·게임)의 auth_request 가 $bff_token 변수를 만든다. 리허설의 기준 설정에는 그런 서비스가 없으므로,
        # 변수를 만드는 자리(내부 전용)만 둔다 — 없으면 map 이 모르는 변수를 참조해 nginx 가 뜨지 않는다. 밖에서는 닿지 않는다.
        location = /_rehearse_bff_token_definer {
            internal;
            auth_request /_rehearse_auth_stub;
            auth_request_set $bff_token $upstream_http_x_doro_access_token;
            return 204;
        }
        location = /_rehearse_auth_stub {
            internal;
            return 204;
        }

        location = /nginx-health {
            default_type text/plain;
            return 200 'ok';
        }

        location = / {
            default_type text/plain;
            return 200 'portal';
        }

        # 8. DORO Menu Frontend (리허설용 가짜 메뉴 서비스)
        location /menu/ {
            proxy_pass http://menu_upstream;
        }
    }
}
