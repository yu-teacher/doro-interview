# 배포 리허설용 가짜 게이트웨이 기준 설정: 실제 게이트웨이와 같은 삽입 기준점(menu_upstream, "# 8. DORO Menu Frontend")만 갖는다.
events {}
http {
    upstream menu_upstream {
        server doro-menu:80;
    }

    server {
        listen 80;

        location = /nginx-health {
            default_type text/plain;
            return 200 'ok';
        }

        location = / {
            default_type text/plain;
            return 200 'portal';
        }

        # 8. DORO Menu Frontend (리허설용 가짜 메뉴 서비스)
        location /menu/ {
            proxy_pass http://menu_upstream;
        }
    }
}
