# ------------------------------------------------------------------------------
# 도로 면접 게이트웨이 설정 조각 (Doro gateway/nginx.conf 에 scripts/apply-gateway-interview.sh 로 반영한다)
#
# 게이트웨이 nginx.conf 는 CI 가 배포하지 않으므로 서버에서 직접 반영한다. 스크립트가 반영 전에 컨테이너 안에서 새 설정을 먼저 검증하고(nginx -t),
# 같은 inode 로 덮어쓴 뒤 reload 하며, 확인이 실패하면 백업으로 되돌린다. 읽기 전용 서비스라 로그인(BFF auth_request)·Guard 는 없다(M2 에서 추가).
#
# 규칙(Doro docs/GATEWAY_ROUTING_RULES.md §6): 접두는 /interview/ 로 구체적이고, 포털 정규식 location(/logs /login /signup /account /portal …)과
# 이름이 겹치지 않으며, Guard 를 프록시하지 않는다. nginx 는 접두사 location 중 가장 긴 것을 고르므로 /interview/api/ 가 /interview/ 보다 먼저 선택된다.
# ------------------------------------------------------------------------------

# 1) http 블록의 upstream 모음에 추가 (컨테이너 이름은 docker-compose.prod.yml 과 같다)
upstream interview_web_upstream {
    server doro-interview-web:80;
}

upstream interview_api_upstream {
    server doro-interview-api:8088;
}

# 2) server(443) 블록에 추가

# 2-1) API: /interview/api/... -> 백엔드의 /api/...  읽기 전용이라 GET/HEAD 만 통과시킨다(백엔드도 405 로 막지만 한 겹 더).
location /interview/api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://interview_api_upstream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2-2) 웹(SPA). 스크립트는 자기 출처(self)만 허용한다(외부 스크립트·폰트 없음, 글꼴은 시스템 글꼴).
#      블로그/포털의 CSP 는 건드리지 않는다. location 에 add_header 가 있으면 서버 수준 헤더를 상속하지 않으므로 공통 헤더를 다시 적는다.
#      처음 반영할 때는 Content-Security-Policy-Report-Only 로 바꿔 /csp-report 에 위반이 없는지 보고, 문제가 없으면 강제로 전환한다.
location /interview/ {
    proxy_pass http://interview_web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Content-Security-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;
}

location = /interview {
    return 301 /interview/;
}
