# ------------------------------------------------------------------------------
# 도로 면접 게이트웨이 설정 조각 (Doro gateway/nginx.conf 에 scripts/apply-gateway-interview.sh 로 반영한다)
#
# 게이트웨이 nginx.conf 는 CI 가 배포하지 않으므로 서버에서 직접 반영한다. 스크립트가 반영 전에 컨테이너 안에서 새 설정을 먼저 검증하고(nginx -t),
# 같은 inode 로 덮어쓴 뒤 reload 하며, 확인이 실패하면 백업으로 되돌린다. 로그인은 서비스 밖의 BFF(doro-bff)가 맡고, 이 조각은 그 연결(로그인·콜백·
# 로그아웃 라우트, auth_request, Authorization 헤더)을 담는다. Guard 는 없다(편집자 권한이 생기는 M4 에서 추가).
#
# 이 조각은 게이트웨이 기본 설정에 이미 있는 BFF 공용 정의에 의존한다(없으면 scripts/gateway_insert.py 가 반영 전에 거부한다):
#   upstream bff_upstream, map $bff_token $bff_authorization, location @bff_forbidden, location @bff_unavailable
#
# 규칙(Doro docs/GATEWAY_ROUTING_RULES.md §6): 접두는 /interview/ 로 구체적이고, 포털 정규식 location(/logs /login /signup /account /portal …)과
# 이름이 겹치지 않으며, Guard 를 프록시하지 않는다. nginx 는 접두사 location 중 가장 긴 것을 고르므로 /interview/api/ 가 /interview/ 보다 먼저 선택된다.
# ------------------------------------------------------------------------------

# 1) http 블록의 upstream 모음에 추가 (컨테이너 이름은 docker-compose.prod.yml 과 같다)
upstream interview_web_upstream {
    server doro-interview-web:80;
}

upstream interview_api_upstream {
    server doro-interview-api:8088;
}

# 2) server(443) 블록에 추가

# 2-0) BFF 로그인·콜백·로그아웃: 브라우저가 보는 주소(/interview/api/v1/bff/…)와 쿠키 경로(/interview)는 서비스 안의 BFF 를 쓰던 때와 같고, 게이트웨이가 BFF 의
#      /bff/interview/… 로 이어 준다. 세션 조회(/interview/api/v1/bff/session)는 아래 /interview/api/ 로 서비스 백엔드가 처리한다.
location = /interview/api/v1/bff/login {
    proxy_pass http://bff_upstream/bff/interview/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /interview/api/v1/bff/callback {
    proxy_pass http://bff_upstream/bff/interview/callback;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /interview/api/v1/bff/logout {
    proxy_pass http://bff_upstream/bff/interview/logout;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2-0') auth_request 대상(내부 전용: 밖에서 부르면 404). 쿠키가 있을 때만 BFF 를 부른다 — 쿠키가 없는 공개 읽기는 BFF 가 죽어 있어도 영향이 없다.
location = /_bff_auth_interview {
    internal;
    if ($cookie_doro_interview_session = "") { return 204; }
    proxy_pass http://bff_upstream/internal/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # upstream 이름(bff_upstream)의 밑줄이 Host 로 나가면 Tomcat 이 400 으로 거부하므로 원래 Host 를 전달한다.
    proxy_set_header Host $host;
    proxy_set_header X-Doro-Service interview;
    proxy_set_header X-Original-Method $request_method;
    proxy_connect_timeout 2s;
    proxy_read_timeout 6s;
}

# 2-1) API: /interview/api/... -> 백엔드의 /api/...
#      요청마다 auth_request 로 쿠키를 토큰으로 바꿔 받아 Authorization 으로 넘긴다(쿠키가 있으면 클라이언트가 보낸 Authorization 은 버린다).
#      쓰기는 PUT 만 통과시킨다(체크·노트는 멱등 PUT. 백엔드도 405 로 막지만 한 겹 더). 로그아웃은 위의 별도 location 이라 영향이 없다.
location /interview/api/ {
    limit_except GET HEAD PUT { deny all; }
    auth_request /_bff_auth_interview;
    auth_request_set $bff_token $upstream_http_x_doro_access_token;
    error_page 403 = @bff_forbidden;
    error_page 500 = @bff_unavailable;
    proxy_set_header Authorization $bff_authorization;
    proxy_pass http://interview_api_upstream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2-2) 웹(SPA). 스크립트는 자기 출처(self)만 허용한다(외부 스크립트·폰트 없음, 글꼴은 시스템 글꼴).
#      블로그/포털의 CSP 는 건드리지 않는다. location 에 add_header 가 있으면 서버 수준 헤더를 상속하지 않으므로 공통 헤더를 다시 적는다.
#      처음 반영할 때는 Content-Security-Policy-Report-Only 로 바꿔 /csp-report 에 위반이 없는지 보고, 문제가 없으면 강제로 전환한다.
location /interview/ {
    proxy_pass http://interview_web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Content-Security-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=()" always;
    # 방문 통계(구글 애널리틱스 4, docs/ANALYTICS.md): 위 세 줄의 구글 주소는 GA 를 쓸 때만 필요하다. 측정 ID 를 설정하지 않으면 웹이 구글에 아무것도 요청하지 않는다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; font-src 'self' data:; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;
}

location = /interview {
    return 301 /interview/;
}
